# 安卓端构建参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ⚠️ 必须开：眼镜 SDK 的 AAR（platform-4.8.0.4-release.aar）的 classes.jar 里
# 引用了 460 次 androidx.*（appcompat / core / fragment / activity / lifecycle /
# localbroadcastmanager）。关掉 AndroidX 会直接构建失败，报找不到 androidx 类。
# （原来这里是 false，因为那时我们追求"零依赖"；接 SDK 之后这条守不住了。）
android.useAndroidX=true

android.nonTransitiveRClass=true
